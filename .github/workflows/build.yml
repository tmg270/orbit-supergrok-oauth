name: Compile Java sketch

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download org.json
        run: curl -sL -o org.json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
      - name: Compile SuperGrokAuth.java
        run: |
          mkdir -p build
          javac --release 17 -cp org.json.jar -d build src/main/java/com/example/supergrok/SuperGrokAuth.java
          echo "Sketch compiled successfully."
